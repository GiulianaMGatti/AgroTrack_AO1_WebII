<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>Login demo</title>
  <link rel="stylesheet" href="estilos.css" />
</head>

<body>
  <h1>Login de demostración</h1>

<form id="loginForm">
  <p>
    Ingrese su nombre de Usuario y Clave. Este demo no valida con base de datos,
    solo muestra los datos ingresados.
  </p>
  <label>
    Usuario:
    <input type="text" name="usuario" size="30" placeholder="Ingrese el Usuario" required>
  </label><br>
  <label>
    Clave:
    <input type="password" name="clave" size="30" placeholder="Ingrese su contraseña" required>
  </label><br>
  <button type="submit">Enviar</button>
</form>

<!-- contenedor para mostrar el mensaje -->
<p id="mensaje-login"></p>

<p><a href="/">Inicio</a></p>

 <footer>
    <small> &copy; 2025 Desarrollado por Giuliana Mandrini Gatti </small>
  </footer>

<script>
  const form = document.getElementById('loginForm');
  const mensaje = document.getElementById('mensaje-login');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    mensaje.textContent = 'Verificando credenciales...';
    mensaje.style.color = 'white';

    const data = Object.fromEntries(new FormData(form));

    try {
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const text = await res.text();

      if (res.ok) {
        mensaje.textContent = '✅ Login exitoso. Redirigiendo...';
        mensaje.style.color = 'limegreen';

        // redirige después de 1,5 segundos
        setTimeout(() => {
          window.location.href = '/contacto.html'; // o '/listarcontactos'
        }, 1500);
      } else {
        mensaje.textContent = '⚠️ ' + text;
        mensaje.style.color = 'orange';
      }
    } catch (err) {
      mensaje.textContent = '❌ Error al enviar el formulario.';
      mensaje.style.color = 'red';
      console.error(err);
    }
  });
</script>

</body>
</html>
